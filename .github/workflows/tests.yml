name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    name: test (PHP ${{ matrix.php }})

    # The SQL tests run against SQLite always, and against these servers
    # through the PHIBBLE_TEST_* DSNs below.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: phibble
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: phibble
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pphibble"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      PHIBBLE_TEST_PGSQL: pgsql:host=127.0.0.1;port=5432;dbname=postgres
      PHIBBLE_TEST_PGSQL_USER: postgres
      PHIBBLE_TEST_PGSQL_PASSWORD: phibble
      PHIBBLE_TEST_MYSQL: mysql:host=127.0.0.1;port=3306
      PHIBBLE_TEST_MYSQL_USER: root
      PHIBBLE_TEST_MYSQL_PASSWORD: phibble

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql, mbstring
          coverage: none

      # phiz, used only to render a docs chart, requires PHP 8.5.
      - if: matrix.php != '8.5'
        run: composer remove --dev phpstats/phiz --no-update --no-interaction

      - run: composer install --no-interaction --no-progress

      # Without the phit extension, the model and native-CSV tests are skipped.
      - run: vendor/bin/pest

  polars:
    # The Polars backend, with the prebuilt php_polars extension from the
    # phpolars release (Linux, PHP 8.5 NTS, glibc >= 2.36).
    runs-on: ubuntu-24.04
    env:
      PHPOLARS_VERSION: v0.1.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Install php_polars
        run: |
          gh release download "$PHPOLARS_VERSION" -R phpstats/phpolars --pattern 'php_polars-*-x86_64-nts-bookworm.*'
          sha256sum -c php_polars-*.sha256
          tar -xzf php_polars-*.tar.gz
          sudo cp php_polars-*/php_polars.so "$(php-config --extension-dir)/"
          echo "extension=php_polars.so" | sudo tee "$(php -r "echo PHP_CONFIG_FILE_SCAN_DIR;")/90-php_polars.ini"
          php -r 'echo Phpolars\version(), "\n";'

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/pest tests/Polars
