name: pages

# GitHub Pages serves redirects to https://phibble.phpstats.org/docs. The
# rendered pages stay in docs/ on main, because phpstats.org imports them.
on:
  push:
    branches: [main]
    paths: ['docs/*.html', 'docs/examples/*.html', 'bin/pages-redirects', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: bin/pages-redirects _pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v4
