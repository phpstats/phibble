project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "examples/*.qmd"
    - "reference/*.qmd"
  resources:
    - data/*.csv

website:
  site-url: "https://phibble.phpstats.org/docs/"
  title: "phibble"
  repo-url: "https://github.com/phpstats/phibble"
  sidebar:
    style: docked
    search: true
    contents:
      - section: "Getting started"
        contents:
          - index.qmd
          - getting-started.qmd
          - coming-from-tibble.qmd
      - section: "Guides"
        contents:
          - types.qmd
          - io.qmd
          - expr.qmd
          - sql.qmd
          - backends.qmd
          - laravel.qmd
      - section: "Functions and methods"
        contents:
          - reference/index.qmd
          - reference/creating.qmd
          - reference/rows-and-columns.qmd
          - reference/grouping.qmd
          - reference/combining.qmd
          - reference/expressions.qmd
          - reference/strings-and-dates.qmd
          - reference/types.qmd
          - reference/output.qmd
          - reference/backends.qmd
      - section: "Examples"
        contents:
          - examples/read-a-csv.qmd
          - examples/database-table.qmd
      - section: "Contributing"
        contents:
          - contract.qmd
          - development.qmd

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    highlight-style: github
